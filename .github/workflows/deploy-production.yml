name: Build and deploy production web form

on:
  pull_request:
    branches: [main]
    paths:
      - "worker.py"
      - "web_server.py"
      - "web/**"
      - "Dockerfile"
      - "Dockerfile.nginx"
      - "deploy/**"
      - "compose.production.yaml"
      - ".github/workflows/deploy-production.yml"
  push:
    branches: [main]
    paths:
      - "worker.py"
      - "web_server.py"
      - "web/**"
      - "Dockerfile"
      - "Dockerfile.nginx"
      - "deploy/**"
      - "compose.production.yaml"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR for production publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/demandas-email-worker:latest
            ghcr.io/${{ github.repository_owner }}/demandas-email-worker:${{ github.sha }}
      - name: Build isolated Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/demandas-email-worker-nginx:latest
            ghcr.io/${{ github.repository_owner }}/demandas-email-worker-nginx:${{ github.sha }}
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure restricted SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Deploy current GHCR images to production
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s\n%s\n' "$GITHUB_TOKEN" "$GITHUB_ACTOR" | ssh -T -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o HostKeyAlias=204.168.214.61 root@guandalini.uk deploy
