services:
  web:
    image: ${DEMANDAS_IMAGE:-ghcr.io/g-guandalini/demandas-email-worker:latest}
    container_name: demandas-web
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:?configure GMAIL_ADDRESS in .env}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?configure GMAIL_APP_PASSWORD in .env}
      DEMANDAS_WEB_HOST: 0.0.0.0
      DEMANDAS_WEB_PORT: 8765
      DEMANDAS_WEB_MAIL_ONLY: "1"
      DEMANDAS_WEB_ALLOWED_ORIGINS: https://demandas.guandalini.uk
    volumes:
      - ./config.json:/app/config.json:ro
    expose:
      - "8765"
    networks:
      - private
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  nginx:
    image: ${DEMANDAS_NGINX_IMAGE:-ghcr.io/g-guandalini/demandas-email-worker-nginx:latest}
    container_name: demandas-nginx
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      web:
        condition: service_healthy
    environment:
      DEMANDAS_WEB_USER: ${DEMANDAS_WEB_USER:?configure DEMANDAS_WEB_USER in .env}
      DEMANDAS_WEB_PASSWORD: ${DEMANDAS_WEB_PASSWORD:?configure DEMANDAS_WEB_PASSWORD in .env}
    tmpfs:
      - /etc/nginx/auth:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=0700
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0700
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=0700
      - /tmp:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=0700
    networks:
      private: {}
      edge:
        aliases:
          - demandas-edge

networks:
  private:
    driver: bridge
  edge:
    name: ${DEMANDAS_EDGE_NETWORK:-app_app-network}
    external: true
